# Perfil de produccion. Los valores obligatorios NO traen valor por defecto:
# si faltan, la guarda de configuracion (ProductionConfigGuard) detiene el
# arranque con un mensaje claro en vez de arrancar con valores de desarrollo.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockcontrol}
    username: ${DB_USERNAME:stockcontrol}
    password: ${DB_PASSWORD:stockcontrol}

app:
  jwt:
    # Obligatorio: secreto aleatorio de al menos 32 caracteres (256 bits).
    secret: ${JWT_SECRET:}
  admin:
    # Obligatorio: contrasena del administrador inicial (nunca 'admin123').
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  cors:
    # Obligatorios: origenes explicitos separados por coma, sin localhost.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoint:
    health:
      show-details: when-authorized
