spring:
  application:
    name: stockcontrol

  # Perfil activo. Se sobreescribe con la variable de entorno SPRING_PROFILES_ACTIVE.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockcontrol}
    username: ${DB_USERNAME:stockcontrol}
    password: ${DB_PASSWORD:stockcontrol}

  jpa:
    # Flyway es la unica fuente de verdad del esquema; Hibernate solo valida.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Permite aplicar Flyway sobre una base de datos ya existente (primer arranque).
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  # Configuracion de seguridad (JWT). En produccion define JWT_SECRET con un valor
  # aleatorio y largo (>= 32 caracteres); el valor por defecto es solo para desarrollo.
  jwt:
    secret: ${JWT_SECRET:dev-secret-cambia-esto-por-favor-min-32-chars-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  # Usuario administrador inicial que se crea si no existe ningun usuario.
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Exponemos solo el endpoint de salud para verificar el arranque.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
